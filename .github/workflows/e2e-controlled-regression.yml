name: Controlled E2E regression

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SMART_CRM_SYNTHETIC_QA_ONLY to run the production synthetic-fixture preflight.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  controlled-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_PRIMARY_EMAIL: ${{ secrets.E2E_PRIMARY_EMAIL }}
      E2E_PRIMARY_PASSWORD: ${{ secrets.E2E_PRIMARY_PASSWORD }}
      E2E_SECONDARY_EMAIL: ${{ secrets.E2E_SECONDARY_EMAIL }}
      E2E_SECONDARY_PASSWORD: ${{ secrets.E2E_SECONDARY_PASSWORD }}
      CONTROLLED_REGRESSION_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify explicit QA-only confirmation
        shell: bash
        run: |
          if [ "$CONTROLLED_REGRESSION_CONFIRMATION" != "SMART_CRM_SYNTHETIC_QA_ONLY" ]; then
            echo "::error::Controlled regression refused. Confirmation phrase did not match."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run controlled automation preflight
        run: npm run test:e2e:controlled
