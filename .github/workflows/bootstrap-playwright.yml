name: One-time Playwright bootstrap

on:
  push:
    branches:
      - codex/e2e-regression-foundation
    paths:
      - .github/workflows/bootstrap-playwright.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/e2e-regression-foundation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add Playwright test dependency
        run: npm install --save-dev @playwright/test

      - name: Commit dependency lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "Add Playwright test dependency"
          git push origin HEAD:codex/e2e-regression-foundation
