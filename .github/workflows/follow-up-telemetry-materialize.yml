name: Materialize Follow-Up telemetry

on:
  push:
    branches:
      - codex/follow-up-health-telemetry
    paths:
      - scripts/instrument-follow-up-telemetry.mjs
      - .github/workflows/follow-up-telemetry-materialize.yml
      - n8n/workflows/crm-follow-up-engine-mvp.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/follow-up-health-telemetry
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate transformer against current Follow-Up export
        run: node scripts/instrument-follow-up-telemetry.mjs

      - name: Materialize telemetry nodes
        run: node scripts/instrument-follow-up-telemetry.mjs --write

      - name: Validate generated workflow
        run: |
          node -e "const fs=require('fs');const w=JSON.parse(fs.readFileSync('n8n/workflows/crm-follow-up-engine-mvp.json','utf8'));const names=new Set(w.nodes.map(n=>n.name));for(const n of ['Prepare Follow-Up Write Telemetry','Record Follow-Up Write Telemetry','Prepare Follow-Up Suppressed Telemetry','Record Follow-Up Suppressed Telemetry']){if(!names.has(n))throw new Error('missing '+n)};console.log('Generated Follow-Up telemetry workflow PASS')"

      - name: Commit generated export when changed
        shell: bash
        run: |
          if git diff --quiet -- n8n/workflows/crm-follow-up-engine-mvp.json; then
            echo "Workflow export already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add n8n/workflows/crm-follow-up-engine-mvp.json
          git commit -m "Instrument Follow-Up Engine health telemetry"
          git push origin HEAD:codex/follow-up-health-telemetry
