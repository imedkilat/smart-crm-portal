name: Controlled AI scope boundary

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SMART_CRM_AI_SCOPE_QA to run the production-safe AI tenant-boundary probe.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  ai-scope-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_PRIMARY_EMAIL: ${{ secrets.E2E_PRIMARY_EMAIL }}
      E2E_PRIMARY_PASSWORD: ${{ secrets.E2E_PRIMARY_PASSWORD }}
      E2E_SECONDARY_EMAIL: ${{ secrets.E2E_SECONDARY_EMAIL }}
      E2E_SECONDARY_PASSWORD: ${{ secrets.E2E_SECONDARY_PASSWORD }}
      AI_SCOPE_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify explicit QA-only confirmation
        shell: bash
        run: |
          if [ "$AI_SCOPE_CONFIRMATION" != "SMART_CRM_AI_SCOPE_QA" ]; then
            echo "::error::AI scope regression refused. Confirmation phrase did not match."
            exit 1
          fi

      - name: Require QA secrets
        shell: bash
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY E2E_PRIMARY_EMAIL E2E_PRIMARY_PASSWORD E2E_SECONDARY_EMAIL E2E_SECONDARY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install dependencies
        run: npm ci

      - name: Run AI scope boundary regression
        run: npm run test:e2e:ai-scope
