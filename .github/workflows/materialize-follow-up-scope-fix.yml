name: Materialize Follow-Up scope fix

on:
  push:
    branches:
      - codex/fix-follow-up-suppressed-scope
    paths:
      - scripts/instrument-follow-up-telemetry.mjs
      - .github/workflows/materialize-follow-up-scope-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: codex/fix-follow-up-suppressed-scope
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate Follow-Up workflow export
        run: node scripts/instrument-follow-up-telemetry.mjs --write

      - name: Validate scoped suppressed telemetry
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const workflow = JSON.parse(fs.readFileSync('n8n/workflows/crm-follow-up-engine-mvp.json', 'utf8'));
          const node = workflow.nodes.find((item) => item.name === 'Prepare Follow-Up Suppressed Telemetry');
          if (!node) throw new Error('Missing Prepare Follow-Up Suppressed Telemetry');
          const code = node.parameters?.jsCode || '';
          if (!code.includes('const workspaceIds = [...new Set(scopedWorkspaceIds)];')) {
            throw new Error('Suppressed telemetry is not scoped exclusively to scoped_workspace_ids');
          }
          if (code.includes('...workspaceStats.filter')) {
            throw new Error('Suppressed telemetry still unions unscoped workspace_stats');
          }
          console.log('Scoped suppressed telemetry validation PASS');
          NODE

      - name: Commit generated workflow if changed
        run: |
          if git diff --quiet -- n8n/workflows/crm-follow-up-engine-mvp.json; then
            echo "Workflow export already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add n8n/workflows/crm-follow-up-engine-mvp.json
          git commit -m "Regenerate Follow-Up scoped telemetry export"
          git push origin HEAD:codex/fix-follow-up-suppressed-scope
