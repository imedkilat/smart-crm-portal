name: E2E regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/e2e/**'
      - 'scripts/e2e-controlled-preflight.mjs'
      - 'scripts/e2e-outbound-idempotency-replay.mjs'
      - 'scripts/e2e-ai-scope-boundary.mjs'
      - 'scripts/instrument-follow-up-telemetry.mjs'
      - 'scripts/verify-follow-up-scheduled-observability.mjs'
      - 'scripts/follow-up-business-snapshot.mjs'
      - 'scripts/follow-up-business-snapshot-lib.mjs'
      - 'scripts/follow-up-business-snapshot.test.mjs'
      - 'n8n/workflows/crm-follow-up-engine-mvp.json'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-regression.yml'
      - '.github/workflows/e2e-controlled-regression.yml'
      - '.github/workflows/e2e-outbound-idempotency.yml'
      - '.github/workflows/e2e-ai-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      E2E_PRIMARY_EMAIL: ${{ secrets.E2E_PRIMARY_EMAIL }}
      E2E_PRIMARY_PASSWORD: ${{ secrets.E2E_PRIMARY_PASSWORD }}
      E2E_SECONDARY_EMAIL: ${{ secrets.E2E_SECONDARY_EMAIL }}
      E2E_SECONDARY_PASSWORD: ${{ secrets.E2E_SECONDARY_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tenant regression discovery
        run: npm run test:e2e:tenant -- --list

      - name: Validate controlled regression harness syntax
        run: |
          node --check scripts/e2e-controlled-preflight.mjs
          node --check scripts/e2e-outbound-idempotency-replay.mjs
          node --check scripts/e2e-ai-scope-boundary.mjs
          node --check scripts/verify-follow-up-scheduled-observability.mjs
          node --check scripts/follow-up-business-snapshot.mjs
          node --check scripts/follow-up-business-snapshot-lib.mjs
          node --check scripts/follow-up-business-snapshot.test.mjs
          node --test scripts/follow-up-business-snapshot.test.mjs

      - name: Validate Follow-Up telemetry export
        run: |
          node --check scripts/instrument-follow-up-telemetry.mjs
          node scripts/instrument-follow-up-telemetry.mjs
          node - <<'NODE'
          const fs = require('fs');
          const workflow = JSON.parse(fs.readFileSync('n8n/workflows/crm-follow-up-engine-mvp.json', 'utf8'));
          const byName = new Map(workflow.nodes.map((node) => [node.name, node]));
          for (const name of [
            'Prepare Follow-Up Write Telemetry',
            'Record Follow-Up Write Telemetry',
            'Prepare Follow-Up Suppressed Telemetry',
            'Record Follow-Up Suppressed Telemetry',
          ]) {
            if (!byName.has(name)) throw new Error(`Missing telemetry node: ${name}`);
          }
          for (const name of ['Record Follow-Up Write Telemetry', 'Record Follow-Up Suppressed Telemetry']) {
            const node = byName.get(name);
            if (node.parameters?.tableId !== 'automation_runs') throw new Error(`${name} must write only automation_runs`);
            if (node.onError !== 'continueRegularOutput') throw new Error(`${name} must remain non-blocking`);
          }
          const suppressedCode = byName.get('Prepare Follow-Up Suppressed Telemetry')?.parameters?.jsCode || '';
          if (!suppressedCode.includes('const workspaceIds = [...new Set(scopedWorkspaceIds)];')) {
            throw new Error('Suppressed Follow-Up telemetry must be limited to scoped_workspace_ids');
          }
          if (suppressedCode.includes('...workspaceStats.filter')) {
            throw new Error('Suppressed Follow-Up telemetry must not union unscoped workspace_stats');
          }
          const safety = byName.get('Safety Configuration');
          const assignments = safety?.parameters?.assignments?.assignments || [];
          const values = new Map(assignments.map((row) => [row.name, row.value]));
          if (values.get('write_enabled') !== false || values.get('production_mode') !== false) {
            throw new Error('Repo Follow-Up safety defaults must remain write_enabled=false and production_mode=false');
          }
          console.log('Follow-Up telemetry export CI validation PASS');
          NODE

      - name: Require tenant-isolation QA secrets
        shell: bash
        run: |
          missing=0
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY E2E_PRIMARY_EMAIL E2E_PRIMARY_PASSWORD E2E_SECONDARY_EMAIL E2E_SECONDARY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Smoke-test read-only Follow-Up business snapshot
        shell: bash
        run: |
          snapshot_file="$RUNNER_TEMP/follow-up-business-snapshot.json"
          npm run --silent snapshot:follow-up:business > "$snapshot_file"
          SNAPSHOT_FILE="$snapshot_file" node - <<'NODE'
          const fs = require('fs');
          const snapshot = JSON.parse(fs.readFileSync(process.env.SNAPSHOT_FILE, 'utf8'));
          if (snapshot.kind !== 'smart-crm-follow-up-business-snapshot') throw new Error('Unexpected snapshot kind');
          const tables = ['lead_tasks', 'lead_activities', 'lead_quotes', 'outbound_email_deliveries', 'outbound_email_attempts'];
          for (const table of tables) {
            const value = snapshot.tables?.[table];
            if (!Number.isInteger(value?.count) || value.count < 0) throw new Error(`Invalid ${table} count`);
            if (!/^[a-f0-9]{64}$/.test(value?.fingerprint_sha256 || '')) throw new Error(`Invalid ${table} fingerprint`);
          }
          console.log('Read-only Follow-Up business snapshot PASS');
          NODE

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run regression suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
