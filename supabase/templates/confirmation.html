<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f7fb;font-family:Inter,Arial,sans-serif;color:#172033;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e5eaf2;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="padding:28px 32px 18px;">
                <table role="presentation" cellspacing="0" cellpadding="0">
                  <tr>
                    <td style="width:38px;height:38px;border-radius:10px;background:#2493f1;color:#ffffff;text-align:center;font-size:18px;font-weight:700;">S</td>
                    <td style="padding-left:12px;font-size:16px;font-weight:700;">Smart CRM</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:6px 32px 8px;">
                <h1 style="margin:0 0 12px;font-size:26px;line-height:1.25;">Confirm your email</h1>
                <p style="margin:0;color:#667085;font-size:15px;line-height:1.7;">Confirm this email address to finish creating your Smart CRM workspace account.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 32px 26px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#2493f1;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:13px 20px;border-radius:10px;">Confirm email</a>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 30px;color:#98a2b3;font-size:12px;line-height:1.6;">
                If you didn’t create this account, you can safely ignore this email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
